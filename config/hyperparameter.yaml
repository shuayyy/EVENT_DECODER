data:
  dataset_root: data/Dataset_label
  processed_manifest: data/dataset_processed/manifest.json
  target_bit_length: 70
  include_start_end_bits: true
  start_flag: "1101"
  end_flag: "1011"
  rep: true
  use_filtered: true


  excluded_datastrings:
    - datastring_1
    - datastring_11
    - datastring_42
    - datastring_52
    - datastring_57
    - datastring_62
    - datastring_66
    - datastring_67
    - datastring_68
    - datastring_71
  # Keep explicit sample-level excludes for known bad edge cases.
  excluded_samples:
    - seq_000001_datastring_1_chunk_001_sample_000001
    - seq_000062_datastring_62_chunk_002_sample_000262
    - seq_000067_datastring_67_chunk_002_sample_000289

training:
  task: fixed_bits # fixed_bits, ctc
  group_repetitions: true
  shuffle: true
  num_workers: 0
  log_dir: outputs/logs
  ema:
    enabled: true
    decay: 0.99
    start_epoch: 1
    evaluate_with_ema: true

ctc_decode:
  method: greedy # greedy, beam
  beam_width: 25
  target_bit_length: 70
  length_penalty: 2.0
  exact_length_preferred: true
  use_repetition_voting: true

split:
  seed: 42
  train_ratio: 0.90
  val_ratio: 0.10

model:
  model_type: transformer # lstm, transformer, mamba
  input_dim: 13
  output_dim: 3

models:
  lstm:
    batch_size: 32
    epochs: 50
    hidden_dim: 254
    num_layers: 4
    bidirectional: true
    dropout: 0.0
    learning_rate: 0.00005
    weight_decay: 0.000
    grad_clip: 1.0

  transformer:
    batch_size: 8
    epochs: 30
    hidden_dim: 256
    num_layers: 4
    nhead: 8
    ff_dim: 512
    dropout: 0.0
    use_positional_encoding: true
    learning_rate: 0.0001
    weight_decay: 0.0005
    lr_schedule:
      enabled: true
      initial_lr: 0.00015
      switch_epoch: 20
      final_lr: 0.0001

  mamba:
    batch_size: 32
    epochs: 1000
    hidden_dim: 256
    num_layers: 4
    d_state: 64
    d_conv: 16
    expand: 2
    dropout: 0.0
    learning_rate: 0.0003
